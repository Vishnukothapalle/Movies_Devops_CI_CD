name: Frontend Continues Integration
on:
  pull_request:
    branches:
    - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/setup-node
      
      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint
  
  test:
    runs on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup NodeJs
        uses: actions/setupt-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
        
      - name: Install Dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: starter/frontend
        run: CI=true npm test--watchAll=false
  
  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg
            REACT_APP_MOVIE_API_URL = http://localhost:5000 \
                                                      --tag 
            mp-frontend:latest .
   